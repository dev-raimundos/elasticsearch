server.name: kibana
server.host: 0.0.0.0
server.port: 5601
server.publicBaseUrl: ${KIBANA_PUBLIC_URL}
elasticsearch.hosts: ["https://elasticsearch:9200"]
elasticsearch.username: kibana_system
elasticsearch.password: ${KIBANA_PASSWORD}
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/ca/ca.crt"]
elasticsearch.ssl.verificationMode: full
xpack.security.encryptionKey: ${KIBANA_SECURITY_KEY}
xpack.encryptedSavedObjects.encryptionKey: ${KIBANA_SAVED_OBJECTS_KEY}
xpack.reporting.encryptionKey: ${KIBANA_REPORTING_KEY}
xpack.security.secureCookies: ${KIBANA_SECURE_COOKIES}
