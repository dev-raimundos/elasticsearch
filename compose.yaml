name: elasticsearch-db

x-image: &image docker.elastic.co/elasticsearch/elasticsearch:9.5.5

services:
  setup:
    image: *image
    user: "0"
    entrypoint: ["/bin/bash", "/setup.sh"]
    environment:
      ES_CERT_IP: ${ES_CERT_IP:?Defina ES_CERT_IP no .env}
    volumes:
      - ./.docker/setup.sh:/setup.sh:ro
      - certs:/usr/share/elasticsearch/config/certs
      - public-ca:/public-ca
    restart: "no"

  elasticsearch:
    image: *image
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no .env}
      ES_JAVA_OPTS: -Xms${ES_HEAP_SIZE:-2g} -Xmx${ES_HEAP_SIZE:-2g}
    ports:
      - "${ES_BIND_IP:?Defina ES_BIND_IP no .env}:${ES_PORT:-9200}:9200"
    volumes:
      - ./.docker/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ${ES_DATA_DIR:?Defina ES_DATA_DIR no .env}:/usr/share/elasticsearch/data
      - ${ES_BACKUP_DIR:-./backups}:/mnt/snapshots
      - certs:/usr/share/elasticsearch/config/certs:ro
    mem_limit: ${ES_MEMORY_LIMIT:-4g}
    cpus: 2.0
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", 'curl --fail --silent --cacert config/certs/ca/ca.crt -u "elastic:$$ELASTIC_PASSWORD" "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kibana-setup:
    image: *image
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Defina KIBANA_PASSWORD}
    entrypoint: ["/bin/bash", "/kibana-setup.sh"]
    volumes:
      - ./.docker/kibana-setup.sh:/kibana-setup.sh:ro
      - public-ca:/public-ca:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: unless-stopped
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    environment:
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Defina KIBANA_PASSWORD}
      KIBANA_SECURITY_KEY: ${KIBANA_SECURITY_KEY:?Defina KIBANA_SECURITY_KEY}
      KIBANA_SAVED_OBJECTS_KEY: ${KIBANA_SAVED_OBJECTS_KEY:?Defina KIBANA_SAVED_OBJECTS_KEY}
      KIBANA_REPORTING_KEY: ${KIBANA_REPORTING_KEY:?Defina KIBANA_REPORTING_KEY}
      KIBANA_PUBLIC_URL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
      KIBANA_SECURE_COOKIES: ${KIBANA_SECURE_COOKIES:-false}
    ports:
      - "${KIBANA_BIND_IP:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    volumes:
      - ./.docker/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - public-ca:/usr/share/kibana/config/ca:ro
      - kibana-data:/usr/share/kibana/data
    mem_limit: ${KIBANA_MEMORY_LIMIT:-2g}
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/api/status > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  certs:
  public-ca:
  kibana-data:
